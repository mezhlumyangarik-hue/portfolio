<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ c.title }}</title>
  <meta name="description" content="{{ c.description }}">
  <meta name="theme-color" content="#070b14">
  <meta property="og:title" content="{{ c.title }}">
  <meta property="og:description" content="{{ c.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Armenian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="noise"></div>
<div class="progress" id="progress"></div>

<!-- Top Promo Banner -->
<div class="top-banner">
  <span class="pulse-dot"></span>
  <span>{{ c.promo_badge }}</span>
  <button type="button" class="banner-link open-modal-btn" data-service="Հատուկ առաջարկ">{{ c.promo_btn }} →</button>
</div>

<header class="header" id="header">
  <a class="brand" href="?lang={{ lang }}" aria-label="Mezhlumyan Web Dev">
    <span class="brand-mark">M<span>.</span></span>
    <span class="brand-name">MEZHLUMYAN<span>WEB STUDIO</span></span>
  </a>
  <nav class="nav" id="nav">
    <a href="#approach">{{ c.nav[0] }}</a>
    <a href="#services">{{ c.nav[1] }}</a>
    <a href="#projects">{{ c.nav[2] }}</a>
    <a href="#contact">{{ c.nav[3] }}</a>
  </nav>
  <div class="header-right">
    <div class="languages">
      <a class="{{ 'active' if lang=='hy' else '' }}" href="?lang=hy">HY</a>
      <a class="{{ 'active' if lang=='ru' else '' }}" href="?lang=ru">RU</a>
      <a class="{{ 'active' if lang=='en' else '' }}" href="?lang=en">EN</a>
    </div>
    <button type="button" class="header-cta magnetic open-modal-btn" data-service="Կայքի պատվեր">
      <span>{{ c.cta_contact }}</span>
      <i class="fa-solid fa-bolt"></i>
    </button>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu"><span></span><span></span></button>
  </div>
</header>

<main>
<section class="hero" id="top">
  <div class="hero-grid"></div>
  <div class="hero-glow"></div>
  <div class="hero-inner">
    <div class="hero-copy">
      <div class="eyebrow reveal"><span class="eyebrow-dot"></span>{{ c.eyebrow }}</div>
      <h1>
        <span class="line-mask"><span class="line-inner">{{ c.headline_a }}</span></span>
        <span class="line-mask accent-line"><span class="line-inner">{{ c.headline_b }}</span></span>
      </h1>
      <p class="hero-lead reveal">{{ c.lead }}</p>
      <div class="hero-actions reveal">
        <button type="button" class="button button-primary magnetic open-modal-btn" data-service="Նոր կայք">
          {{ c.cta_contact }} <i class="fa-solid fa-rocket"></i>
        </button>
        <a class="button button-glass" href="#projects">{{ c.cta_work }} <i class="fa-solid fa-arrow-down"></i></a>
      </div>
      
      <!-- Live Stats in Hero -->
      <div class="hero-stats-row reveal">
        <div class="h-stat"><b>50+</b><span>ՆԱԽԱԳԾԵՐ</span></div>
